    <h2>英雄定位分类</h2>
    <dl>
        <dt>决斗Duel</dt>
        <dd>突破手，拥有进攻技能，负责打开局面，如捷风、雷兹</dd>
        <dt>先锋Initiator</dt>
        <dd>信息位，探查敌人位置，给团队创造进攻机会，如猎枭、斯凯</dd>
        <dt>哨卫Sentinel</dt>
        <dd>防守英雄，布置陷阱，守住点位，如奇乐、零</dd>
        <dt>控场Controller</dt>
        <dd>烟位，释放烟雾分割战场，如炼狱、海神</dd>
